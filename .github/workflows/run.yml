name: RO Shop Price Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘自動巡查一次
  workflow_dispatch:        # 依然保留隨時手動點按立即查詢

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允許保存與更新已通知紀錄
    steps:
      - name: 簽出代碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件與瀏覽器核心
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: 執行比價監控
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RO_COOKIE: ${{ secrets.RO_COOKIE }}
        run: python main.py

      - name: 保存已通知商品紀錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json || true
          git commit -m "Update seen deals [skip ci]" || true
          git push || true
